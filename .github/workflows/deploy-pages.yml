name: Deploy Mini App to GitHub Pages

# Собираем фронтенд (Telegram Mini App) и публикуем dist/ в ветку gh-pages.
# Бэкенд (server/) сюда не входит — для первого теста фронт работает на демо-данных.
#
# Разовая настройка после первого успешного прогона:
#   Settings → Pages → Build and deployment → Source: "Deploy from a branch"
#   Branch: gh-pages / (root) → Save
# Адрес: https://hippoundefined101r-spec.github.io/-/

on:
  push:
    branches:
      - claude/laughing-volta-70jmpp
    paths-ignore:
      - 'server/**'
      - 'SPEC.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build
        run: |
          npm install
          npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
